<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Juego de Plataformas</title>
        <link rel="stylesheet" href="../css/style.css">
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    </head>

    <body>
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>
        <div class="cloud cloud4"></div>
        
        <header>
            <nav id="menu">
                <div id="dropdownMenu">
                    <a href="/">Inicio</a>
                    <a href="/help">Ayuda</a>
                    <a href="/creditos">Creditos</a>
                    <a href="/estadisticas">Estadísticas</a>
                    <a href="/info">Acerca de</a>
                </div>
            </nav>
        </header>

        <main class="game-layout">
            <aside class="left-panel">
                <div class="logo-container" style="max-width: 150px; margin: 0 auto;">
                    <img src="../assets/logo.svg" alt="Logo del juego" class="game-logo" style="width: 100%; height: auto;">
                </div>
                <section id="instrucciones">
                    <h2 class="panel-title" style="font-size: 25px;">Controles</h2>
                    <div class="controls-container">
                        <div class="control-item movement-control">
                            <div class="movement-keys">
                                <span class="control-key">A</span>
                                
                                <span class="control-key">D</span>
                            </div>
                            <span class="control-description">Movimiento</span>
                        </div>
                        <div class="control-item movement-control">
                            <div class="movement-keys">
                                <span class="control-key">W</span>
                                <span class="control-key">S</span>
                            </div>
                            <span class="control-description">Subir y Bajar escaleras</span>
                        </div>
                        <div class="control-item">
                            <span class="control-key">Space</span>
                            <span class="control-description">Brincar</span>
                        </div>
                        <div class="control-item">
                            <span class="control-key">P</span>
                            <span class="control-description">Pausar</span>
                        </div>
                        <div class="control-item">
                            <span class="control-key">E</span>
                            <img src="../assets/Items/Fire_ball_icon/fireball.png" alt="Fireball" class="fireball-icon">
                            <span class="control-description">Lanzar fireball</span>
                        </div>
                    </div>
                </section>
            </aside>

            <div id="gameContainer">
                <div class="canvas-wrapper">
                    <canvas id="canvas"></canvas>
                </div>
            </div>

            <aside class="right-panel" style="
                display: flex;
                flex-direction: column;
                height: 100%;
                min-height: 300px;
                position: relative;
            ">
                <section id="welcome-message">
                    <h2 class="panel-title">¡Bienvenido!</h2>
                    <p id="user-greeting" style="text-align: center; color: #ffd700; font-size: 1.2em; margin: 10px 0;"></p>
                </section>
                <section id="game-stats">
                    <h2 class="panel-title">Estado del Juego</h2>
                    <div class="stats-container">
                        <div class="stat-item">
                            <h3>Nivel</h3>
                            <p id="level">1</p>
                        </div>
                    </div>
                </section>
                <div style="
                    position: fixed;
                    bottom: 1rem;
                    right: 1rem;
                    z-index: 1000;
                    background: rgba(0, 0, 0, 0.8);
                    padding: 0.5rem;
                    border-radius: 8px;
                    border: 2px solid #ffd700;
                    box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
                ">
                    <button id="logoutButton" style="
                        background: linear-gradient(90deg, #ff2d00 0%, #ff9900 50%, #fff700 100%);
                        color: #fff;
                        border: none;
                        border-radius: 5px;
                        padding: 0.8rem 1.5rem;
                        font-family: 'Press Start 2P', cursive;
                        cursor: pointer;
                        transition: all 0.3s ease;
                        font-size: clamp(0.7rem, 2vw, 0.8rem);
                        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
                        white-space: nowrap;
                        min-width: 150px;
                    ">Cerrar Sesión</button>
                </div>
            </aside>
        </main>

        <footer>
            <p>© 2025 Juego de Plataformas | Todos los derechos reservados</p>
        </footer>

        <!-- Game Scripts -->
        <script src="../js/game_classes.js"></script>
        <script src="../js/objects.js"></script>
        <script src="../js/enemies.js"></script>
        <script src="../js/sound_manager.js"></script>
        <script src="../js/levelgenerator.js"></script>
        <script src="../js/Server_functions.js"></script>
        <script src="../js/platformer.js"></script>
        <script src="../js/menu.js"></script> 
        <script>
            // Verificar si el usuario está autenticado
            document.addEventListener('DOMContentLoaded', () => {
                const playerId = localStorage.getItem('playerId');
                const playerName = localStorage.getItem('playerName');

                if (!playerId || !playerName) {
                    // Si no hay datos de sesión, redirigir al login
                    window.location.href = 'login.html';
                    return;
                }

                // Mostrar saludo al usuario
                const userGreeting = document.getElementById('user-greeting');
                userGreeting.textContent = `¡Hola ${playerName}!`;

                // Si está autenticado, mostrar el nombre del jugador en el header
                const menu = document.getElementById('dropdownMenu');
                const playerInfo = document.createElement('div');
                playerInfo.style.cssText = `
                    color: #ffd700;
                    padding: 10px;
                    text-align: center;
                    border-bottom: 1px solid #ffd700;
                    margin-bottom: 10px;
                `;
                playerInfo.textContent = `Jugador: ${playerName}`;
                menu.insertBefore(playerInfo, menu.firstChild);

                // Configurar el botón de cerrar sesión
                const logoutButton = document.getElementById('logoutButton');
                logoutButton.addEventListener('click', () => {
                    localStorage.removeItem('playerId');
                    localStorage.removeItem('playerName');
                    window.location.href = 'login.html';
                });

                // Añadir efecto hover al botón
                logoutButton.addEventListener('mouseover', () => {
                    logoutButton.style.transform = 'scale(1.05)';
                    logoutButton.style.boxShadow = '0 0 15px rgba(255, 215, 0, 0.5)';
                });

                logoutButton.addEventListener('mouseout', () => {
                    logoutButton.style.transform = 'scale(1)';
                    logoutButton.style.boxShadow = 'none';
                });
            });
        </script>
    </body>
</html>
